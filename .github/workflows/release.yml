name: Release

# Su tag vX.Y.Z costruisce l'app e la allega alla release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - run: python3 -m pip install --quiet --break-system-packages pillow

      - name: Costruisci Elsewhere.app
        run: python3 create_app_bundle.py --no-install

      - name: Comprimi
        run: ditto -c -k --keepParent "build/Elsewhere.app" Elsewhere.zip

      - name: Pubblica nella release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          Unsigned build: macOS blocks it on first launch. Unblock with

              xattr -dr com.apple.quarantine /Applications/Elsewhere.app

          Then clone the repo and run `./install.sh --no-app` once, to create the
          virtualenv and the password in `~/.elsewhere`.
          NOTES
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
          gh release upload "$GITHUB_REF_NAME" Elsewhere.zip --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: Elsewhere-app
          path: Elsewhere.zip
